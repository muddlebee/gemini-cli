description = "Apply a focused iterative change to the active variant's design"
prompt = """
You are a senior UI/UX designer and frontend engineer. Execute the following steps in order.

## Step 1 — Record the iteration
Call `mcp_superdesignMvp_design_iterate` with instruction set to the full args text.
The response includes the current state with the active variant's existing HTML (in `variants[].preview.html`).

## Step 2 — Generate updated HTML
Take the active variant's current HTML and apply the instruction as a targeted visual change.
- Preserve the overall layout and structure
- Apply only what the instruction asks for (color, typography, spacing, component style, etc.)
- Keep all styles inlined, no external resources
- The result must be a complete `<!doctype html>` document

Call `mcp_superdesignMvp_design_set_variant_html` with:
- variantId: the activeVariantId from the state
- html: the updated HTML

## Step 3 — Report
Return:
1. What changed visually (one sentence)
2. One suggested next instruction to try

Args: {{args}}
"""
