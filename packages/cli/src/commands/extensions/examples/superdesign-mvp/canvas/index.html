<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperDesign Canvas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-left">
          <span class="logo">SuperDesign</span>
          <span id="project-name" class="project-name">No project loaded</span>
        </div>
        <div class="topbar-right">
          <span id="updated-at" class="status-text">waiting for state</span>
          <span id="live-indicator" class="live-dot">●</span>
        </div>
      </header>

      <div class="workspace">
        <main class="stage">
          <div id="preview-area" class="preview-area">
            <div id="empty-state" class="empty-state">
              <p class="empty-icon">⬡</p>
              <p class="empty-title">Waiting for design</p>
              <p class="empty-hint">Run <code>/design:init your prompt</code> to generate variants</p>
            </div>
            <iframe
              id="preview-frame"
              class="preview-frame hidden"
              sandbox="allow-scripts allow-same-origin"
              title="Design preview"
            ></iframe>
          </div>
          <div id="history-bar" class="history-bar"></div>
        </main>

        <aside class="rail">
          <section class="rail-card">
            <h3 class="rail-label">Variants</h3>
            <div id="variant-list" class="variant-list"></div>
          </section>
          <section class="rail-card">
            <h3 class="rail-label">Inspiration</h3>
            <ul id="inspiration-list" class="list compact"></ul>
          </section>
          <section class="rail-card">
            <h3 class="rail-label">Tokens</h3>
            <div id="token-swatches" class="token-swatches"></div>
          </section>
        </aside>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
